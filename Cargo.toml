[package]
name = "rapi"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = {version = "1", features = [ "serde", "v4"] }
dotenv = "0.15"
tokio = { version = "1", features = ["full" ]}
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros", "time", "uuid", "bigdecimal"] }
anyhow = "1.0"   # For clean error propagation
argon2 = "0.5.0"
password-hash  = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
